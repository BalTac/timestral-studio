<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090c" />
      <stop offset="50%" stop-color="#0c0f15" />
      <stop offset="100%" stop-color="#141923" />
    </linearGradient>

    <!-- Mistral Orange Glow -->
    <radialGradient id="orangeGlow" cx="65%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 90, 31, 0.22)" />
      <stop offset="60%" stop-color="rgba(255, 90, 31, 0.04)" />
      <stop offset="100%" stop-color="rgba(255, 90, 31, 0)" />
    </radialGradient>

    <!-- Cyan Ambient Glow -->
    <radialGradient id="cyanGlow" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.12)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </radialGradient>

    <!-- Fan Cone Gradient -->
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 90, 31, 0.05)" />
      <stop offset="40%" stop-color="rgba(255, 90, 31, 0.22)" />
      <stop offset="100%" stop-color="rgba(255, 90, 31, 0.38)" />
    </linearGradient>

    <!-- Fine Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />
  <rect width="1200" height="420" fill="url(#orangeGlow)" />
  <rect width="1200" height="420" fill="url(#cyanGlow)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Top Status Bar -->
  <g transform="translate(48, 42)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="116" height="24" rx="4" fill="rgba(255, 90, 31, 0.14)" stroke="rgba(255, 90, 31, 0.45)" stroke-width="1" />
    <text x="58" y="16" fill="#ff7a45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.04em">TIMESTRAL</text>

    <!-- Pill 2 -->
    <rect x="126" y="0" width="144" height="24" rx="4" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="198" y="16" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">5M &middot; 28M &middot; 123M &middot; 209M</text>

    <!-- Pill 3 -->
    <rect x="280" y="0" width="156" height="24" rx="4" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <text x="358" y="16" fill="#10b981" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">21 NON-CROSSING Qs</text>

    <!-- Pill 4 -->
    <rect x="446" y="0" width="158" height="24" rx="4" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1" />
    <text x="525" y="16" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">&#9888; RESEARCH &amp; DEMO</text>
  </g>

  <!-- Graphic Wave & Probabilistic Cones (Right Side) -->
  <g transform="translate(620, 70)">
    <!-- Historical series -->
    <path d="M 0 170 Q 30 190, 60 155 T 120 160 T 170 120 T 220 140 T 270 95 T 320 110 T 360 85" 
          fill="none" stroke="#64748b" stroke-width="2.5" />

    <!-- Historical Candlestick Accents -->
    <line x1="60" y1="135" x2="60" y2="175" stroke="#10b981" stroke-width="1.2" opacity="0.6"/>
    <rect x="57" y="145" width="6" height="18" fill="#10b981" opacity="0.8" rx="1"/>

    <line x1="120" y1="140" x2="120" y2="180" stroke="#f43f5e" stroke-width="1.2" opacity="0.6"/>
    <rect x="117" y="152" width="6" height="16" fill="#f43f5e" opacity="0.8" rx="1"/>

    <line x1="220" y1="115" x2="220" y2="160" stroke="#10b981" stroke-width="1.2" opacity="0.6"/>
    <rect x="217" y="125" width="6" height="22" fill="#10b981" opacity="0.8" rx="1"/>

    <line x1="270" y1="80" x2="270" y2="125" stroke="#10b981" stroke-width="1.2" opacity="0.6"/>
    <rect x="267" y="88" width="6" height="18" fill="#10b981" opacity="0.8" rx="1"/>

    <!-- In-Sample / Out-of-Sample Split Marker -->
    <line x1="250" y1="10" x2="250" y2="240" stroke="#8ca0b5" stroke-dasharray="4 4" stroke-width="1.2" opacity="0.7"/>
    <text x="242" y="24" fill="#8ca0b5" font-family="monospace" font-size="9" text-anchor="end" letter-spacing="0.05em">IN-SAMPLE</text>
    <text x="258" y="24" fill="#ff8559" font-family="monospace" font-size="9" letter-spacing="0.05em">OUT-OF-SAMPLE</text>

    <!-- Forecast Probabilistic Cones (Fan) -->
    <!-- 98% Interval (q01-q99) -->
    <path d="M 360 85 C 410 70, 470 30, 520 15 L 520 220 C 470 185, 410 135, 360 85 Z" 
          fill="rgba(255, 90, 31, 0.10)" />

    <!-- 80% Interval (q10-q90) -->
    <path d="M 360 85 C 410 75, 470 48, 520 38 L 520 175 C 470 148, 410 115, 360 85 Z" 
          fill="url(#coneGrad)" />

    <!-- Median Forecast Curve (q50) -->
    <path d="M 360 85 C 410 82, 470 78, 520 72" 
          fill="none" stroke="#ff5a1f" stroke-width="3" stroke-dasharray="5 3" />

    <!-- Upper Edge q90 -->
    <path d="M 360 85 C 410 75, 470 48, 520 38" 
          fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />

    <!-- Lower Edge q10 -->
    <path d="M 360 85 C 410 100, 470 148, 520 175" 
          fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />

    <!-- Forecast Target Dots -->
    <circle cx="520" cy="38" r="4" fill="#10b981" />
    <circle cx="520" cy="72" r="5" fill="#ff5a1f" stroke="#07090c" stroke-width="2" />
    <circle cx="520" cy="175" r="4" fill="#f43f5e" />

    <!-- Origin Anchor Dot -->
    <circle cx="360" cy="85" r="6" fill="#ff5a1f" stroke="#07090c" stroke-width="2" />
    <circle cx="360" cy="85" r="11" fill="none" stroke="rgba(255, 90, 31, 0.4)" stroke-width="1.5" />

    <!-- Target Labels -->
    <text x="532" y="42" fill="#10b981" font-family="monospace" font-size="10" font-weight="700">q90 Bull (+2.8%)</text>
    <text x="532" y="76" fill="#ff8559" font-family="monospace" font-size="11" font-weight="700">q50 Mediana</text>
    <text x="532" y="179" fill="#f43f5e" font-family="monospace" font-size="10" font-weight="700">q10 Bear (-2.1%)</text>
  </g>

  <!-- Main Hero Title & Description (Left Side) -->
  <g transform="translate(48, 120)">
    <!-- Main Title -->
    <text x="0" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.025em">
      TIMESTRAL <tspan fill="#ff5a1f">STUDIO</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="92" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="-0.01em">
      Probabilistic Time-Series Workbench &amp; AI-Agent Forecasting API
    </text>

    <!-- Features Bullet Row -->
    <g transform="translate(0, 130)">
      <circle cx="4" cy="-4" r="3" fill="#ff5a1f" />
      <text x="16" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Zero-Shot 21 Quantiles</text>

      <circle cx="185" cy="-4" r="3" fill="#10b981" />
      <text x="197" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Holdout Empirical Backtest</text>

      <circle cx="395" cy="-4" r="3" fill="#38bdf8" />
      <text x="407" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Crypto Strategy Lab (IS/OOS)</text>
    </g>

    <!-- Secondary Meta Row -->
    <g transform="translate(0, 160)">
      <text x="0" y="0" fill="#8ca0b5" font-family="monospace" font-size="11">
        FastAPI &middot; Native Vector SVG &middot; Pi 5 Single-Slot Memory (TTL 300s) &middot; OpenAI / MCP Tools
      </text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#orangeGlow)" />
  <line x1="0" y1="418" x2="380" y2="418" stroke="#ff5a1f" stroke-width="2" />
  <line x1="380" y1="418" x2="680" y2="418" stroke="#10b981" stroke-width="2" />
  <line x1="680" y1="418" x2="1200" y2="418" stroke="#38bdf8" stroke-width="2" />
</svg>
